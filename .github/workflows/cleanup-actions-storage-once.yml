name: One-shot GitHub Actions storage cleanup

on:
  push:
    paths:
      - ".github/workflows/cleanup-actions-storage-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Purge disposable Actions storage
    runs-on: ubuntu-latest
    steps:
      - name: Delete all Actions caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[].id' > /tmp/cache_ids.txt

          deleted=0
          while IFS= read -r cache_id; do
            [[ -z "${cache_id}" ]] && continue
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}"
            deleted=$((deleted + 1))
          done < /tmp/cache_ids.txt

          echo "Deleted ${deleted} Actions cache(s)."

      - name: Delete artifacts older than 24 hours
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cutoff_epoch="$(date -u -d '24 hours ago' +%s)"

          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .created_at, .name] | @tsv' > /tmp/artifacts.tsv

          deleted=0
          kept=0
          while IFS=$'\t' read -r artifact_id created_at artifact_name; do
            [[ -z "${artifact_id}" ]] && continue
            created_epoch="$(date -u -d "${created_at}" +%s)"
            if (( created_epoch < cutoff_epoch )); then
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              echo "Deleted artifact ${artifact_name} (${artifact_id}) from ${created_at}."
              deleted=$((deleted + 1))
            else
              echo "Kept recent artifact ${artifact_name} (${artifact_id}) from ${created_at}."
              kept=$((kept + 1))
            fi
          done < /tmp/artifacts.tsv

          echo "Deleted ${deleted} stale artifact(s); kept ${kept} artifact(s) newer than 24 hours."
