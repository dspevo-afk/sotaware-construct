name: Android Stage 0 gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-stage-0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Gradle gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      # AGP 9.0 requires JDK 17; the Gradle wrapper supplies Gradle 9.1.0.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      # Use the wrapper and the open-source cache provider. This caches Gradle
      # dependencies and wrapper state, not project build outputs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace --console=plain :app:assembleDebug

      - name: Run debug unit tests
        run: ./gradlew --no-daemon --stacktrace --console=plain :app:testDebugUnitTest

      - name: Run debug lint
        run: ./gradlew --no-daemon --stacktrace --console=plain :app:lintDebug
