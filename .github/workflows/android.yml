name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Gradle gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      # AGP 9.0 requires JDK 17; the Gradle wrapper supplies Gradle 9.1.0.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      # Use the wrapper and the open-source cache provider. This caches Gradle
      # dependencies and wrapper state, not project build outputs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace --console=plain :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Verify native qualification runner
        run: python3 -B tools/test_native_qualification.py

      - name: Verify logcat script with mocked ADB
        shell: pwsh
        run: ./tools/test_run_logcat_app.ps1

      - name: Run debug unit tests
        run: ./gradlew --no-daemon --stacktrace --console=plain :app:testDebugUnitTest

      - name: Run debug lint
        run: ./gradlew --no-daemon --stacktrace --console=plain :app:lintDebug

      - name: Preserve Gradle qualification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-host-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn

  native-smoke:
    name: Disposable emulator qualification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build application and instrumentation APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --console=plain :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM for the disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run account-free native regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          avd-name: ConstructCiDisposable
          emulator-port: 5554
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: >-
            python3 -B tools/run_native_qualification.py
            --serial emulator-5554
            --avd-name ConstructCiDisposable
            --disposable-confirmation I_UNDERSTAND_DISPOSABLE_TARGET
            --suite smoke
            --apk app/build/outputs/apk/debug/app-debug.apk
            --test-apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            --output-dir "${{ runner.temp }}/native-qualification"

      - name: Preserve native qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-native-smoke
          path: |
            ${{ runner.temp }}/native-qualification/
            app/build/reports/
          if-no-files-found: warn
